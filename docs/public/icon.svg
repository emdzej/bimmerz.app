<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 60" fill="none">
  <!--
    ///B emblem, redrawn from a polished concept (fal, 2026-11). Three
    M-tricolour stripes (light blue, violet-navy, red) and a heavy
    italic B with rounded bowls, all on one slant.
    Everything is drawn upright inside a group with
    matrix(1 0 -0.35 1 0 0): x' = x − 0.35·y, so every vertical edge
    leans 0.35 (≈19.3°), the stripes and the B's stem exactly parallel.
    The stripes are 9.22 wide on a 12.81 pitch; the B is one even-odd
    path: outer contour (flat top, upper bowl, waist notch, wider lower
    bowl) plus the two counters, square on the stem side and round on
    the right.
    Favicon: the B is dark navy, so it works without theme switching.
    Theme variants for the in-page logo are icon-light.svg and
    icon-dark.svg (VitePress logo and hero.image light/dark slots).
  -->
  <g transform="matrix(1 0 -0.35 1 0 0)">
    <rect x="22.0" y="0" width="9.22" height="60" fill="#2fa4e2" />
    <rect x="34.81" y="0" width="9.22" height="60" fill="#302967" />
    <rect x="47.62" y="0" width="9.22" height="60" fill="#e1232b" />
    <path fill="#0f1628" fill-rule="evenodd" d="M60.36,0.0 H94.42 C104.11,0.0 113.09,8.12 113.09,17.66 C113.09,22.81 110.98,26.56 107.39,28.44 C113.33,30.47 118.48,35.94 118.48,45.31 C118.48,55.62 112.23,60.0 98.8,60.0 H60.36 Z M76.3,12.19 H91.45 C94.73,12.19 97.08,14.69 97.08,17.81 C97.08,21.09 94.73,23.44 91.45,23.44 H76.3 Z M77.16,35.0 H95.36 C98.95,35.0 101.53,37.81 101.53,41.09 C101.53,44.38 98.95,47.03 95.36,47.03 H77.16 Z" />
  </g>
</svg>
